<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search · OpenDCL Forums Archive</title>
  <link rel="stylesheet" href="assets/style.css">
  
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <p class="banner">Legacy OpenDCL Forums archive (SMF). Read-only.
        New discussion: <a href="https://github.com/OpenDCL/community/discussions">GitHub Discussions</a>.
      </p>
      <div class="nav">
        <a class="brand" href="index.html">OpenDCL Forums Archive</a>
        <nav>
          <a href="index.html">Boards</a>
          <a href="search.html">Search</a>
        </nav>
      </div>
      
    </div>
  </header>
  <main class="wrap">
    <h1>Search</h1>
    <form class="search-box" id="search-form" action="search.html" method="get">
      <input type="search" id="q" name="q" placeholder="Search titles, posts, authors…" autofocus>
      <button type="submit">Search</button>
    </form>
    <p id="search-meta" class="muted"></p>
    <div id="search-results"></div>
    <script src="assets/search.js"></script>

  </main>
  <footer class="site-footer wrap">
    <p>Generated from the July 2026 SMF database dump. Authors are display names from the original forum, not verified GitHub accounts.</p>
  </footer>
</body>
</html>
